
<!DOCTYPE html> 
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SASSHOPGAME - Game Topup</title>
<style>
body{margin:0;background:#101014;color:white;font-family:Arial}
header{text-align:center;padding:25px;background:#1b1b22;border-bottom:3px solid #e52b3b}
header h1{margin:0;color:white}
header span{color:#f04444}
.hero{margin:20px;padding:35px 15px;text-align:center;border-radius:15px;background:linear-gradient(135deg,#670d19,#17171e)}
main{max-width:600px;margin:auto;padding:10px 20px}
h2{margin-top:30px}
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:#22222b;border:1px solid #444;padding:25px 5px;text-align:center;border-radius:12px;cursor:pointer}
.game.active{border:2px solid #f04444}
form{background:#202027;padding:18px;border-radius:12px}
label{display:block;margin:15px 0 7px}
input,select{width:100%;padding:13px;box-sizing:border-box;background:#111;color:white;border:1px solid #555;border-radius:8px}
button{width:100%;padding:15px;margin-top:20px;background:#ed2939;color:white;border:0;border-radius:8px;font-weight:bold}
footer{text-align:center;padding:30px;color:#aaa}
</style>
</head>
<body>
<header>
<h1>SAS<span>SHOPGAME</span></h1>
<p>YOUR GAME YOUR POWER</p>
</header>
<div class="hero">
<h2>GAME TOPUP STORE</h2>
<p>Fast • Easy • Affordable</p>
</div>
<main>
<h2>PILIH GAME</h2>
<div class="games">
<div class="game active" onclick="pick(this,'Mobile Legends')">🎮<br>Mobile Legends</div>
<div class="game" onclick="pick(this,'PUBG Mobile')">🔫<br>PUBG Mobile</div>
<div class="game" onclick="pick(this,'Free Fire')">🔥<br>Free Fire</div>
<div class="game" onclick="pick(this,'Honor of Kings')">⚔️<br>Honor of Kings</div>
</div>
<h2>BUAT PESANAN</h2>
<form onsubmit="order(event)">
<label>Game</label>
<input id="game" value="Mobile Legends" readonly>
<label>User ID</label>
<input id="uid" placeholder="Masukkan User ID" required>
<label>Server ID</label>
<input id="server" placeholder="Masukkan Server ID">
<label>Pilih pakej</label>
<select id="pack" required>
<option value="">Pilih pakej</option>
<option>50 Diamonds</option>
<option>100 Diamonds</option>
<option>250 Diamonds</option>
<option>500 Diamonds</option>
<option>1000 Diamonds</option>
</select>
<button type="submit">TEMPAH SEKARANG</button>
</form>
</main>
<footer>SASSHOPGAME © 2026</footer>
<script>
function pick(el,name){
document.querySelectorAll('.game').forEach(x=>x.classList.remove('active'));
el.classList.add('active');
document.getElementById('game').value=name;
}

function order(e){
e.preventDefault();

const game = document.getElementById('game').value;
const uid = document.getElementById('uid').value;
const server = document.getElementById('server').value;
const pack = document.getElementById('pack').value;

const message = `PESANAN SASSHOPGAME
Game: ${game}
User ID: ${uid}
Server ID: ${server}
Pakej: ${pack}`;

window.open(
'https://wa.me/60102888699?text=' +
encodeURIComponent(message),
'_blank'
);
}
</script>
</body>
</html>
